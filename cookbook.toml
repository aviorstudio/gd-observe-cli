version = 1
recipe = "rust-cli"

[[components.rust]]
name = "cli"
manifest = "Cargo.toml"
binaries = ["gd-observe-cli"]
profile = "release"

[package]
binary = "gd-observe-cli"
component = "cli"
output = ".artifacts/build/gd-observe-cli"
profile = "release"
files = ["README.md", "LICENSE"]
version_arguments = ["version"]
version_template = "{binary} {version} ({commit}, {date})"

[[package.native_targets]]
runner = "ubuntu-24.04"
target = "x86_64-unknown-linux-musl"
platform = "Linux"
arch = "x86_64"
extension = "tar.gz"
checks = ["tests/tls_test.py"]

[[package.native_targets]]
runner = "ubuntu-24.04-arm"
target = "aarch64-unknown-linux-musl"
platform = "Linux"
arch = "arm64"
extension = "tar.gz"
checks = ["tests/tls_test.py"]

[[package.native_targets]]
runner = "macos-15-intel"
target = "x86_64-apple-darwin"
platform = "Darwin"
arch = "x86_64"
extension = "tar.gz"
checks = []

[[package.native_targets]]
runner = "macos-26"
target = "aarch64-apple-darwin"
platform = "Darwin"
arch = "arm64"
extension = "tar.gz"
checks = []

[[package.native_targets]]
runner = "windows-2025"
target = "x86_64-pc-windows-msvc"
platform = "Windows"
arch = "x86_64"
extension = "zip"
checks = []

[[package.native_targets]]
runner = "windows-11-arm"
target = "aarch64-pc-windows-msvc"
platform = "Windows"
arch = "arm64"
extension = "zip"
checks = []

[artifacts]
paths = ["dist", ".artifacts/build", ".artifacts/native-package"]
environment = ["VERSION", "COMMIT", "DATE", "RUST_TARGET"]
revision_environment = ["COMMIT"]

[artifacts.binary_environment]
TLS_TEST_BINARY = ".artifacts/build/gd-observe-cli"

[lint]
shell_paths = ["scripts/install.sh"]

[[tests.lint]]
runner = "python"
path = "tests/release_guard_test.py"

[[tests.integration]]
runner = "python"
path = "tests/installer_test.py"

[[tests.integration]]
runner = "python"
path = "tests/tls_test.py"

[clean]
paths = ["dist", "target", ".artifacts/build", ".artifacts/rust-target", ".artifacts/native-package", ".artifacts/advisory-db"]
